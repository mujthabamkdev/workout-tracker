<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#grad1)" stroke-width="12" stroke-dasharray="8 8" opacity="0.3"/>
  
  <!-- Dumbbell / Lightning Aegis Icon -->
  <g transform="translate(106, 126)" filter="url(#glow)">
    <!-- Dumbbell Bar -->
    <rect x="50" y="120" width="200" height="20" rx="10" fill="#f8fafc" />
    <!-- Left Plate Outer -->
    <rect x="25" y="70" width="25" height="120" rx="8" fill="url(#grad1)" />
    <!-- Left Plate Inner -->
    <rect x="50" y="85" width="16" height="90" rx="6" fill="#38bdf8" />
    <!-- Right Plate Inner -->
    <rect x="234" y="85" width="16" height="90" rx="6" fill="#38bdf8" />
    <!-- Right Plate Outer -->
    <rect x="250" y="70" width="25" height="120" rx="8" fill="url(#grad1)" />
    <!-- Center Pulse / Flame -->
    <path d="M150 40 L168 100 L140 100 L155 170 L115 110 L140 110 Z" fill="#10b981" stroke="#f8fafc" stroke-width="3"/>
  </g>
</svg>
